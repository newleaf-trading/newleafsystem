<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What kind of trader are you? — NewLeaf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --forest:#16271C; --forest2:#1E3326; --forest3:#27412F;
    --gold:#B68F3E; --gold-lt:#E7D9AE;
    --cream:#F2ECDD; --card:#FBF8F0;
    --terra:#BC5B43; --teal:#3E7C6A;
    --display:'Fraunces',Georgia,serif;
    --body:'DM Sans',system-ui,sans-serif;
    --mono:'Space Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--forest);color:var(--cream);font-family:var(--body);-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;justify-content:center;padding:28px 20px 64px}
  .stage{width:100%;max-width:600px}

  /* ---- progress ticks ---- */
  .ticks{display:flex;gap:4px;margin-bottom:8px}
  .tick{flex:1;height:3px;background:var(--forest3);border-radius:2px;transition:background .35s ease}
  .tick.done{background:var(--gold)}
  .tick.now{background:var(--gold-lt)}
  .meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;
        letter-spacing:.08em;text-transform:uppercase;color:#8FA396;margin-bottom:34px}

  /* ---- question ---- */
  .axis{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
        color:var(--gold);margin-bottom:14px}
  .setup{font-family:var(--body);font-size:15px;line-height:1.65;color:#C9D6CC;margin-bottom:14px}
  h1{font-family:var(--display);font-size:28px;line-height:1.25;font-weight:600;
     letter-spacing:-.01em;margin-bottom:26px}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{position:relative;overflow:hidden;background:var(--card);color:#243027;border:none;
       border-radius:10px;padding:16px 18px;text-align:left;font-family:var(--body);font-size:15px;
       line-height:1.5;cursor:pointer;transition:transform .12s ease, box-shadow .2s ease}
  .opt:hover:not(:disabled){transform:translateX(3px);box-shadow:-3px 0 0 var(--gold)}
  .opt:focus-visible{outline:2px solid var(--gold-lt);outline-offset:3px}
  .opt:disabled{cursor:default}
  .opt .label{position:relative;z-index:2;display:block}

  /* the signature: consensus fill sliding in behind the option text */
  .fill{position:absolute;inset:0 auto 0 0;width:0;z-index:1;background:#EAE2CE;transition:width .7s cubic-bezier(.22,.9,.3,1)}
  .opt.best .fill{background:#CFE0D4}
  .opt.picked{box-shadow:inset 0 0 0 2px var(--forest3)}
  .pct{position:relative;z-index:2;float:right;font-family:var(--mono);font-size:12px;color:#5C6B5F;
       opacity:0;transition:opacity .4s ease .35s}
  .revealed .pct{opacity:1}
  .youtag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
          background:var(--forest);color:var(--gold-lt);padding:2px 6px;border-radius:4px;margin-left:8px;
          vertical-align:1px}

  .insight{margin-top:20px;padding:16px 18px;border-left:2px solid var(--teal);background:var(--forest2);
           border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.6;color:#D8E2DA;
           opacity:0;transform:translateY(6px);transition:all .4s ease .2s}
  .insight.show{opacity:1;transform:none}
  .insight b{color:var(--gold-lt);font-weight:700}

  .next{margin-top:22px;background:var(--gold);color:var(--forest);border:none;border-radius:8px;
        padding:14px 26px;font-family:var(--body);font-weight:700;font-size:15px;cursor:pointer;
        opacity:0;pointer-events:none;transition:opacity .3s ease}
  .next.show{opacity:1;pointer-events:auto}
  .next:hover{background:var(--gold-lt)}
  .next:focus-visible{outline:2px solid var(--cream);outline-offset:3px}

  /* ---- start + result ---- */
  .center{text-align:center;padding-top:36px}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  .big{font-family:var(--display);font-size:42px;line-height:1.1;font-weight:600;letter-spacing:-.02em;margin:16px 0 18px}
  .lede{font-size:16px;line-height:1.65;color:#C9D6CC;max-width:440px;margin:0 auto 30px}

  .score-ring{font-family:var(--display);font-size:70px;font-weight:600;color:var(--gold-lt);line-height:1}
  .score-cap{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8FA396;margin-top:6px}
  .arche{font-family:var(--display);font-size:34px;font-weight:600;margin:26px 0 6px}
  .arche-sub{font-size:15px;color:#C9D6CC;line-height:1.6;max-width:430px;margin:0 auto}

  .bars{margin:34px 0 8px;text-align:left}
  .bar-row{margin-bottom:14px}
  .bar-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;
           letter-spacing:.08em;text-transform:uppercase;color:#8FA396;margin-bottom:6px}
  .bar{height:8px;background:var(--forest3);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--teal);border-radius:4px;
         transition:width .9s cubic-bezier(.22,.9,.3,1)}
  .bar-row.top i{background:var(--gold)}
  .bar-row.top .bar-top{color:var(--gold-lt)}

  .callout{text-align:left;background:var(--forest2);border:1px solid var(--forest3);border-radius:10px;
           padding:20px;margin-top:14px}
  .callout h3{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
              color:var(--gold);font-weight:400;margin-bottom:8px}
  .callout p{font-size:15px;line-height:1.6;color:#D8E2DA}
  .callout+.callout{margin-top:10px}

  .footnote{font-size:12.5px;line-height:1.6;color:#7C8F83;margin-top:26px;text-align:left}
  .again{background:none;border:1px solid var(--forest3);color:#8FA396;border-radius:8px;
         padding:11px 20px;font-family:var(--body);font-size:14px;cursor:pointer;margin-top:22px}
  .again:hover{border-color:var(--gold);color:var(--gold-lt)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:480px){h1{font-size:23px}.big{font-size:32px}.arche{font-size:27px}}
</style>

<div class="stage" id="stage"></div>

<script>
/* ------------------------------------------------------------------
   Front-door quiz. 12 items, ~4 minutes.
   Design rules encoded here:
     - no red, ever. A weaker pick shades neutral, not wrong.
     - consensus bar reveals how many traders picked the same thing.
     - result is an archetype + your STRONGEST axis. Never a deficit.
   consensus[] values are placeholders until real telemetry exists.
-------------------------------------------------------------------*/

const Q = [
{ axis:'System', setup:'Your checklist has eight rules. Tonight seven of them pass.',
  q:'What do you do?',
  opts:[
    {t:'Skip it and wait for a cleaner one', p:10, c:34, trait:'discipline'},
    {t:'Take it, but at half your usual size', p:5, c:41, trait:'caution'},
    {t:'Take it normally — seven out of eight is strong', p:2, c:19, trait:'conviction'},
    {t:'Take it and note which rule failed', p:6, c:6, trait:'curiosity'}],
  insight:'<b>Most traders size down. The stronger move is to skip.</b> Size controls how much you lose, not whether the trade was worth taking. A rule you can halve your way past is not a rule.'},

{ axis:'Emotion', setup:'A trade is up 60% of its maximum profit. Your written rule says close at 50%. The chart still looks great.',
  q:'What do you do?',
  opts:[
    {t:'Close it. The rule already fired', p:10, c:38, trait:'discipline'},
    {t:'Close half, let half run', p:5, c:33, trait:'balance'},
    {t:'Hold. Conditions are clearly favourable', p:2, c:29, trait:'conviction'}],
  insight:'<b>The last 40% of a trade is the worst-paid part of it.</b> You wait longest, risk most, and earn least. Everyone knows this. Almost nobody closes.'},

{ axis:'Risk', setup:'£20,000 account. You risk 2% per trade. This trade can lose £200 per contract.',
  q:'How many contracts?',
  opts:[
    {t:'2', p:10, c:52, trait:'discipline'},
    {t:'4', p:3, c:22, trait:'conviction'},
    {t:'1 — round down to be safe', p:7, c:18, trait:'caution'},
    {t:'Depends how good the setup looks', p:0, c:8, trait:'conviction'}],
  insight:'<b>£400 is the budget, £200 is the risk, so two.</b> The last option is the interesting one: the moment size depends on how a setup feels, you no longer have a risk limit — you have a suggestion.'},

{ axis:'Emotion', setup:'A stock jumps 8% on news. It was not on your watchlist. Your group chat is lighting up.',
  q:'What do you do?',
  opts:[
    {t:'Nothing. Write down what a valid entry would look like', p:10, c:28, trait:'patience'},
    {t:'Take a small position to be involved', p:3, c:31, trait:'conviction'},
    {t:'Wait for it to pull back to where it started', p:4, c:27, trait:'caution'},
    {t:'Sell premium — the options got expensive', p:6, c:14, trait:'curiosity'}],
  insight:'<b>A missed move is not a signal.</b> Small size does not repair a missing reason. And that old price is just a number you remember — the company is worth something different now.'},

{ axis:'Knowledge', setup:'You sold an option. A week passes. The stock has not moved and nothing else changed.',
  q:'Good or bad for you?',
  opts:[
    {t:'Good — the option is worth less than when you sold it', p:10, c:64, trait:'curiosity'},
    {t:'Bad — you need movement to make money', p:2, c:16, trait:'conviction'},
    {t:'Neutral — nothing happened', p:3, c:20, trait:'caution'}],
  insight:'<b>Time is the seller\'s ally.</b> An option is partly a bet on what might still happen. Every day that passes, there is less "still" left to pay for.'},

{ axis:'Emotion', setup:'You paid £2.10 for a position. It is now worth £1.05. You are holding on until it gets back to £2.10.',
  q:'What is the honest question to ask yourself?',
  opts:[
    {t:'Would I buy this today at £1.05?', p:10, c:44, trait:'discipline'},
    {t:'How much time is left for it to recover?', p:5, c:32, trait:'curiosity'},
    {t:'Should I buy more to lower my average?', p:0, c:24, trait:'conviction'}],
  insight:'<b>The market has never heard of your entry price.</b> If you would not open this position now, then holding it is a decision you are making by not deciding.'},

{ axis:'Risk', setup:'You hold short put spreads on NVDA, AMD and MSFT. Each one is 1.5% of your account.',
  q:'How many positions is that, really?',
  opts:[
    {t:'Close to one. In a tech selloff they all move together', p:10, c:47, trait:'discipline'},
    {t:'Three. They are separate companies', p:2, c:29, trait:'conviction'},
    {t:'Three, but I would count it as about two', p:6, c:24, trait:'balance'}],
  insight:'<b>Diversification is about what things do in a bad week, not how many tickers you own.</b> Correlation has a nasty habit of arriving exactly when you needed it not to.'},

{ axis:'Market', setup:'A company reports earnings tomorrow. Its options are unusually expensive today.',
  q:'Why?',
  opts:[
    {t:'The market is pricing in a big move, direction unknown', p:10, c:57, trait:'curiosity'},
    {t:'The market expects the stock to go up', p:2, c:21, trait:'conviction'},
    {t:'Demand from traders buying ahead of the event', p:6, c:22, trait:'balance'}],
  insight:'<b>Expensive options mean "something is about to happen", not "something good is about to happen".</b> Price says how far. It does not say which way.'},

{ axis:'Emotion', setup:'You just took the biggest loss of your month. It is 10:04am. Your hands are a bit shaky.',
  q:'What do you do?',
  opts:[
    {t:'Stop for the day and write up what happened', p:10, c:36, trait:'discipline'},
    {t:'Keep trading, but at half size', p:5, c:34, trait:'balance'},
    {t:'Re-enter the same idea at a better price', p:0, c:19, trait:'conviction'},
    {t:'Flip and trade the other direction', p:0, c:11, trait:'conviction'}],
  insight:'<b>The hour after a big loss is when your decisions are worst and your urge to make them is strongest.</b> That is not a coincidence — it is the whole problem.'},

{ axis:'Knowledge', setup:'A stock trades at 100. You sold the 95 put and collected £1.50.',
  q:'Below what price do you start losing money at expiry?',
  opts:[
    {t:'£93.50', p:10, c:49, trait:'curiosity'},
    {t:'£95.00', p:5, c:33, trait:'caution'},
    {t:'£96.50', p:2, c:18, trait:'balance'}],
  insight:'<b>The premium you collected is your cushion.</b> You are fine down to 95, and then the £1.50 absorbs the next £1.50 of damage. Below £93.50 it starts costing you.'},

{ axis:'System', setup:'You have found a setup you like and you are about to place the order.',
  q:'When do you decide where you will get out?',
  opts:[
    {t:'Before the order goes in', p:10, c:58, trait:'discipline'},
    {t:'Once you see how it opens', p:2, c:19, trait:'conviction'},
    {t:'You set a target now and figure out the loss side later', p:4, c:23, trait:'balance'}],
  insight:'<b>An exit decided while you are holding risk is not an exit, it is a reaction.</b> Most traders know the answer here and still do it in the wrong order. Being right on paper is the easy half.'},

{ axis:'Emotion', setup:'Seven winners in a row. You are up 14% in six weeks. Your system was modelled at a 68% win rate; you are running at 74%.',
  q:'Do you increase your size?',
  opts:[
    {t:'No. Seven trades cannot tell you your edge improved', p:10, c:41, trait:'discipline'},
    {t:'No, but only because the rules say not to', p:7, c:26, trait:'caution'},
    {t:'Yes, modestly — the results support it', p:2, c:26, trait:'conviction'},
    {t:'Yes. Press an edge when it is working', p:0, c:7, trait:'conviction'}],
  insight:'<b>Over 40-odd trades, a 74% rate and a 68% rate are the same rate wearing different clothes.</b> The cost of being wrong about that is paid in real drawdown, which is why the streak feels like evidence and is not.'}
];

const ARCHE = {
  discipline:{name:'The Architect', line:'You build the thing and then you trust the thing. Your instinct is to decide once, in advance, when it is cheap to think clearly — and then let the plan do the work.',
    edge:'You are unusually resistant to the two failure modes that end most accounts: sizing up after losses, and abandoning an exit rule because the chart looked good.',
    grow:'Your risk is a plan you have outgrown. Process traders under-revise. Book a quarterly review of the rules themselves, with data, so discipline never becomes inertia.'},
  patience:{name:'The Sniper', line:'You are comfortable doing nothing, which is rarer than it sounds. Most of the money in defined-risk trading is made by the trades you decline.',
    edge:'You do not confuse activity with progress. A missed move costs you nothing; you understand that a bad entry costs you twice.',
    grow:'Waiting can quietly become avoiding. Track your No Trade log — if your rejection rate climbs after losses rather than staying flat, that is fear wearing patience as a disguise.'},
  curiosity:{name:'The Scholar', line:'You reach for the mechanism. When something moves, you want to know which part of the machine did it — and that instinct compounds faster than any single strategy.',
    edge:'You correctly attribute outcomes. That is the skill that separates traders who learn from twenty trades from traders who repeat one trade twenty times.',
    grow:'Knowing is not sizing. The most dangerous profile in the data is strong mechanics with loose risk limits. Put the position-sizing rule in writing before the next trade.'},
  caution:{name:'The Guardian', line:'Your first question is always what this could cost. That instinct is the reason people are still trading five years in, and it does not get enough credit.',
    edge:'Capital preservation is not a consolation prize. An edge only pays out to someone who is still there, and you are built to still be there.',
    grow:'Under-sizing is a real cost, just an invisible one. If your risk per trade is well under your own limit, you are paying for comfort in returns you never see.'},
  balance:{name:'The Diplomat', line:'You look for the version of the decision that keeps options open. Half in, half out, hedge the rest — you are drawn to answers that do not commit fully.',
    edge:'You rarely take a catastrophic position, and you adapt faster than traders anchored to one method.',
    grow:'Splitting the difference is sometimes wisdom and sometimes an unwillingness to be wrong in public. Ask of each compromise: would I have chosen this in advance, or only now?'},
  conviction:{name:'The Storm Chaser', line:'You lean in. When you see it, you want size on, and you would rather be decisively wrong than passively right. That energy is the raw material of every good trader.',
    edge:'You act. Plenty of people analyse a setup perfectly and never take it — you are not one of them, and that is not a small thing.',
    grow:'Conviction is the most expensive trait in trading when it is unbounded and the most valuable when it is. Same instinct, one rule: decide your size before you look at the chart.'}
};

const AXES=['Knowledge','Emotion','System','Risk','Market'];

let i=0, picks=[], traits={}, axisPts={}, axisMax={};
const stage=document.getElementById('stage');

start();

function start(){
  stage.innerHTML=`<div class="center">
    <div class="kicker">NewLeaf · 12 questions · about 4 minutes</div>
    <div class="big">What kind of trader<br>are you?</div>
    <p class="lede">Twelve situations. No jargon, no maths beyond arithmetic, no wrong answers that make you feel stupid. You will see what other traders picked after each one.</p>
    <button class="next show" id="go">Start</button>
  </div>`;
  document.getElementById('go').onclick=()=>{i=0;picks=[];traits={};axisPts={};axisMax={};render();};
}

function render(){
  const q=Q[i];
  stage.innerHTML=`
    <div class="ticks">${Q.map((_,n)=>`<div class="tick ${n<i?'done':n===i?'now':''}"></div>`).join('')}</div>
    <div class="meta"><span>${String(i+1).padStart(2,'0')} / ${Q.length}</span><span>${q.axis}</span></div>
    <div class="axis">${q.axis}</div>
    <p class="setup">${q.setup}</p>
    <h1>${q.q}</h1>
    <div class="opts" id="opts">
      ${q.opts.map((o,n)=>`<button class="opt" data-n="${n}">
          <span class="fill"></span>
          <span class="pct">${o.c}%</span>
          <span class="label">${o.t}</span>
        </button>`).join('')}
    </div>
    <div class="insight" id="ins">${q.insight}</div>
    <button class="next" id="next">${i===Q.length-1?'See your result':'Next'}</button>`;

  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
}

function choose(n){
  const q=Q[i], best=Math.max(...q.opts.map(o=>o.p));
  picks.push(n);
  const o=q.opts[n];
  traits[o.trait]=(traits[o.trait]||0)+1;
  axisPts[q.axis]=(axisPts[q.axis]||0)+o.p;
  axisMax[q.axis]=(axisMax[q.axis]||0)+best;

  stage.querySelectorAll('.opt').forEach((b,k)=>{
    b.disabled=true;
    b.classList.add('revealed');
    if(q.opts[k].p===best) b.classList.add('best');
    if(k===n){
      b.classList.add('picked');
      b.querySelector('.label').insertAdjacentHTML('beforeend','<span class="youtag">YOU</span>');
    }
    requestAnimationFrame(()=>{b.querySelector('.fill').style.width=q.opts[k].c+'%';});
  });

  document.getElementById('ins').classList.add('show');
  const nx=document.getElementById('next');
  nx.classList.add('show');
  nx.onclick=()=>{i++; i<Q.length?render():result();};
  nx.focus({preventScroll:true});
}

function result(){
  // Instinct Score: generous by design. Floor 50, so nobody is told they are bad at this.
  const raw=Object.values(axisPts).reduce((a,b)=>a+b,0)/Object.values(axisMax).reduce((a,b)=>a+b,0);
  const score=Math.round(50+50*raw);

  const rows=AXES.filter(a=>axisMax[a]).map(a=>({a,pct:Math.round(100*axisPts[a]/axisMax[a])}))
                 .sort((x,y)=>y.pct-x.pct);
  const topAxis=rows[0];

  const domTrait=Object.entries(traits).sort((a,b)=>b[1]-a[1])[0][0];
  const A=ARCHE[domTrait]||ARCHE.balance;

  stage.innerHTML=`<div class="center">
    <div class="kicker">Your trading instinct</div>
    <div class="score-ring">${score}</div>
    <div class="score-cap">out of 100</div>
    <div class="arche">${A.name}</div>
    <p class="arche-sub">${A.line}</p>

    <div class="bars" id="bars">
      ${rows.map((r,n)=>`<div class="bar-row ${n===0?'top':''}">
        <div class="bar-top"><span>${r.a}</span><span>${r.pct}%</span></div>
        <div class="bar"><i data-w="${r.pct}"></i></div>
      </div>`).join('')}
    </div>

    <div class="callout"><h3>Your strongest instinct — ${topAxis.a}</h3><p>${A.edge}</p></div>
    <div class="callout"><h3>Your growth edge</h3><p>${A.grow}</p></div>

    <p class="footnote">Twelve questions is a conversation starter, not a measurement. The full NewLeaf assessment runs 40 questions across five dimensions and includes checks this version cannot make — including whether your rules hold up when you are losing, not just when you are winning.</p>
    <button class="again" id="again">Take it again</button>
  </div>`;

  requestAnimationFrame(()=>{
    stage.querySelectorAll('.bar i').forEach((el,n)=>{
      setTimeout(()=>{el.style.width=el.dataset.w+'%';}, 120+n*90);
    });
  });
  document.getElementById('again').onclick=start;
}
</script>
