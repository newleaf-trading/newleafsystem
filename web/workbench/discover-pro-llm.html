<script>
const API_URL = window.__CONFIG__.API_URL;
const API_KEY = window.__CONFIG__.API_KEY;

function apiHeaders() {
  return { 'Content-Type': 'application/json', 'X-API-Key': API_KEY };
}

const MODELS = [
  { id: 'qwen-plus',     label: 'qwen-plus',       cost: '$0.80/M' },
  { id: 'qwen-max',      label: 'qwen-max',        cost: '$1.60/M' },
  { id: 'qwen3-max',     label: 'qwen3-max',       cost: '$2/M' },
  { id: 'claude-sonnet',  label: 'claude-sonnet 4', cost: '$3/M' },
  { id: 'claude-haiku',   label: 'claude-haiku 4.5',cost: '$0.80/M' },
  { id: 'gemini-pro',     label: 'gemini 2.5 pro',  cost: '$1.25/M' },
  { id: 'gemini-flash',   label: 'gemini 2.5 flash', cost: '$0.075/M' },
  { id: 'gpt-4',          label: 'gpt-4o',          cost: '$2.50/M' },
  { id: 'gpt-5.5',        label: 'gpt-5.5',         cost: '$3/M' },
  { id: 'deepseek',       label: 'deepseek-chat',   cost: '$0.27/M' },
  { id: 'deepseek-r1',    label: 'deepseek-r1',     cost: '$0.55/M' },
  { id: 'grok',           label: 'grok-4',          cost: '$3/M' },
];

function $(id) { return document.getElementById(id); }
let currentSpot = 0; // captured from snapshot

function formatLegs(legs) {
  if (!legs || !legs.length) return '—';
  return legs.map(l => {
    const action = l.side === 'short' ? 'SELL' : (l.action === 'SELL' ? 'SELL' : 'BUY');
    const qty = (l.qty && l.qty > 1) ? `${l.qty}x ` : '';
    return `${qty}${action} ${l.type} $${l.strike}`;
  }).join(' / ');
}

function confidenceClass(c) {
  // Support both 0-10 and 0-100 scales
  const n = typeof c === 'number' ? c : 0;
  if (n >= 7 || n >= 65) return 'high';
  if (n >= 4 || n >= 40) return 'mid';
  return 'low';
}

function formatConfidence(c) {
  if (c == null || c === '—') return '—';
  // Display as X/10 for consistency
  return typeof c === 'number' ? `${c}` : c;
}

// ── Payoff math (inlined from legMath.js) ────────────────────────
function computeNetCredit(legs) {
  let nc = 0;
  for (const l of legs) nc += l.side === 'short' ? (l.mid || 0) : -(l.mid || 0);
  return nc;
}

function pnlAt(price, legs, qty, netCredit) {
  const nc = netCredit ?? computeNetCredit(legs);
  let pnl = nc * 100 * qty;
  for (const l of legs) {
    const intrinsic = l.type === 'call' ? Math.max(0, price - l.strike) : Math.max(0, l.strike - price);
    pnl += (l.side === 'long' ? intrinsic : -intrinsic) * 100 * qty;
  }
  return pnl;
}

function computeBreakevens(legs, qty) {
  if (!legs.length) return [];
  const nc = computeNetCredit(legs);
  const strikes = legs.map(l => l.strike);
  const lo = Math.min(...strikes) - 20, hi = Math.max(...strikes) + 20;
  const bks = [];
  for (let i = 1; i <= 500; i++) {
    const p0 = lo + (hi - lo) * (i - 1) / 500, p1 = lo + (hi - lo) * i / 500;
    const v0 = pnlAt(p0, legs, qty, nc), v1 = pnlAt(p1, legs, qty, nc);
    if ((v0 >= 0) !== (v1 >= 0)) bks.push(p0 + (0 - v0) * (p1 - p0) / (v1 - v0));
  }
  return bks;
}

function normalizeLegs(rawLegs, spot) {
  const expanded = [];
  for (const l of rawLegs) {
    const side = l.side || (l.action === 'SELL' || l.action === 'short' ? 'short' : 'long');
    let mid = l.mid || l.premium || 0;
    if (!mid || mid <= 0) {
      const dist = Math.abs(l.strike - spot) / spot;
      mid = Math.max(0.05, spot * 0.02 * Math.exp(-dist * 10));
    }
    const qty = l.qty || 1;
    for (let i = 0; i < qty; i++) {
      expanded.push({ side, type: l.type, strike: l.strike, mid });
    }
  }
  return expanded;
}

function drawCardChart(containerId, legs, spot) {
  if (!legs.length) return;
  const strikes = legs.map(l => l.strike);
  const minS = Math.min(...strikes), maxS = Math.max(...strikes);
  const range = maxS - minS || 10;
  const lo = minS - range * 0.8, hi = maxS + range * 0.8;
  const step = Math.max(0.25, range / 150);
  const pnlData = [], profitData = [], lossData = [];
  let minPnl = Infinity, maxPnl = -Infinity;

  for (let p = lo; p <= hi; p += step) {
    const pnl = pnlAt(p, legs, 1);
    const x = +p.toFixed(2), y = +pnl.toFixed(2);
    pnlData.push([x, y]);
    profitData.push([x, y >= 0 ? y : 0]);
    lossData.push([x, y < 0 ? y : 0]);
    if (pnl < minPnl) minPnl = pnl;
    if (pnl > maxPnl) maxPnl = pnl;
  }

  const be = computeBreakevens(legs, 1);
  const mp = Math.max(0, maxPnl), ml = Math.abs(Math.min(0, minPnl));
  const nc = computeNetCredit(legs);

  // Metrics strip
  const metricsEl = document.getElementById('metrics-' + containerId);
  if (metricsEl) {
    let beText = '—';
    if (be.length >= 2) { be.sort((a,b) => a - b); beText = '$' + be[0].toFixed(0) + ' / $' + be[1].toFixed(0); }
    else if (be.length === 1) beText = '$' + be[0].toFixed(0);
    metricsEl.innerHTML = `
      <div class="card-metric"><div class="card-metric-label">Max Profit</div><div class="card-metric-value profit">$${mp.toFixed(0)}</div></div>
      <div class="card-metric"><div class="card-metric-label">Max Loss</div><div class="card-metric-value loss">-$${ml.toFixed(0)}</div></div>
      <div class="card-metric"><div class="card-metric-label">Breakevens</div><div class="card-metric-value">${beText}</div></div>
      <div class="card-metric"><div class="card-metric-label">Net Credit</div><div class="card-metric-value profit">$${Math.abs(nc).toFixed(2)}</div></div>
    `;
  }

  // Plot lines
  const xPlotLines = [
    { value: spot, color: '#C9A96E', width: 2, dashStyle: 'Dash', zIndex: 3,
      label: { text: '$' + spot.toFixed(0), style: { fontSize: '11px', fontWeight: '700', color: '#C9A96E' }, y: -6 } }
  ];
  be.forEach(b => xPlotLines.push({
    value: b, color: 'rgba(150,145,135,0.5)', width: 1, dashStyle: 'Dot', zIndex: 2,
    label: { text: 'BE $' + b.toFixed(0), style: { fontSize: '10px', fontWeight: '600', color: '#6b6b60' }, y: 14 }
  }));

  Highcharts.chart(containerId, {
    chart: { backgroundColor: 'transparent', height: 220, style: { fontFamily: "'Inter', sans-serif" }, spacingTop: 10, spacingBottom: 5 },
    title: { text: null },
    xAxis: {
      title: null,
      labels: { format: '${value}', style: { fontFamily: "'Space Mono', monospace", fontSize: '9px', color: '#9b9b8e' } },
      plotLines: xPlotLines, gridLineWidth: 0,
      lineColor: 'rgba(15,61,46,0.12)', tickColor: 'rgba(15,61,46,0.12)',
    },
    yAxis: {
      title: null,
      labels: { format: '${value}', style: { fontFamily: "'Space Mono', monospace", fontSize: '9px', color: '#9b9b8e' } },
      plotLines: [{ value: 0, color: 'rgba(120,120,120,0.4)', width: 1, dashStyle: 'Dash', zIndex: 1 }],
      gridLineColor: 'rgba(229,225,212,0.6)',
    },
    legend: { enabled: false },
    tooltip: {
      backgroundColor: 'rgba(255,255,255,0.96)', borderColor: 'rgba(15,61,46,0.15)', borderRadius: 8,
      style: { fontFamily: "'Inter', sans-serif", fontSize: '11px' },
      formatter: function() {
        const col = this.y >= 0 ? '#1a8c5e' : '#c0392b';
        return '<b>$' + this.x.toFixed(0) + '</b><br/>P&L: <b style="color:' + col + '">$' + this.y.toFixed(0) + '</b>';
      }
    },
    plotOptions: {
      area: { lineWidth: 0, marker: { enabled: false }, states: { hover: { lineWidth: 0 } }, threshold: 0 },
      line: { marker: { enabled: false }, states: { hover: { lineWidthPlus: 1 } } },
    },
    series: [
      { type: 'area', name: 'Profit', data: profitData, color: '#0B2D23', fillColor: 'rgba(11,45,35,0.08)', lineWidth: 0 },
      { type: 'area', name: 'Loss', data: lossData, color: '#c0392b', fillColor: 'rgba(192,57,43,0.08)', lineWidth: 0 },
      { type: 'line', name: 'P&L', data: pnlData, color: '#0B2D23', lineWidth: 2.5 },
    ],
    credits: { enabled: false },
  });
}

function createCard(model) {
  const card = document.createElement('div');
  card.className = 'result-card';
  card.id = `card-${model.id}`;
  card.innerHTML = `
    <div class="card-header">
      <div class="card-header-left">
        <span class="model-name">${model.label}</span>
        <span class="model-cost">${model.cost}</span>
      </div>
      <span id="status-${model.id}" class="model-status waiting">waiting</span>
    </div>
    <div id="body-${model.id}" class="card-placeholder">Waiting...</div>
  `;
  return card;
}

function setCardRunning(modelId) {
  const card = $(`card-${modelId}`);
  const status = $(`status-${modelId}`);
  const body = $(`body-${modelId}`);
  if (card) card.className = 'result-card running';
  if (status) { status.className = 'model-status running'; status.textContent = 'running'; }
  if (body) { body.className = 'card-placeholder'; body.innerHTML = '<span class="spinner"></span> Querying model...'; }
}

function setCardResult(modelId, result) {
  const card = $(`card-${modelId}`);
  const status = $(`status-${modelId}`);
  const body = $(`body-${modelId}`);
  if (!card || !body) return;

  const ro = result.reasoningOverride;
  const decision = ro?.decision || (ro?.noTrade ? 'NO_TRADE' : (ro?.confidence === 0 && (!ro?.suggestedLegs?.length) ? 'NO_TRADE' : 'APPROVED_TRADE'));
  const isNoTrade = decision === 'NO_TRADE' || decision === 'DATA_ERROR';
  const isWatchlist = decision === 'WATCHLIST_TRADE';
  card.className = 'result-card ' + (isNoTrade ? 'no-trade' : isWatchlist ? 'watchlist' : 'approved');
  if (status) { status.className = 'model-status done'; status.textContent = `${(result.elapsed / 1000).toFixed(1)}s`; }

  const strategy = isNoTrade ? 'NO_TRADE' : (ro?.strategy || result.strategy || '—');
  const confidence = ro?.confidence ?? '—';
  const reasoning = ro?.reasoning || '—';
  const rawLegs = ro?.suggestedLegs || [];
  const costUsd = result.cost?.totalCost != null ? `$${result.cost.totalCost.toFixed(4)}` : '—';
  const chartId = 'chart-' + modelId;
  const killSwitch = ro?.killSwitch || ro?.riskControls?.killSwitch || '';
  const profitTarget = ro?.profitTarget || ro?.riskControls?.profitTarget || '';
  const stopLoss = ro?.stopLoss || ro?.riskControls?.stopLoss || '';
  const timeExit = ro?.timeExit || ro?.riskControls?.timeExit || '';
  const valErrors = ro?.validationErrors || [];
  const decisionLabel = isNoTrade ? 'NO TRADE' : isWatchlist ? 'WATCHLIST' : 'APPROVED';
  const decisionClass = isNoTrade ? 'no-trade' : isWatchlist ? 'watchlist' : 'approved';

  body.className = '';
  body.innerHTML = `
    <div class="card-topline">
      <span class="decision-badge ${decisionClass}">${decisionLabel}</span>
      ${!isNoTrade ? `<span class="strategy-badge">${strategy.replace(/_/g, ' ')}</span>` : ''}
      <span class="confidence ${confidenceClass(confidence)}">${confidence}<span style="font-size:11px;color:var(--ink-faint)">/10</span></span>
    </div>
    ${valErrors.length ? `<div style="margin-bottom:8px;font-family:var(--mono);font-size:10px;padding:6px 8px;border-radius:4px;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;"><b>Validation:</b> ${valErrors.join('; ')}</div>` : ''}
    <div class="reasoning-text">${reasoning}</div>
    ${rawLegs.length ? `
      <div class="card-chart">
        <div id="metrics-${chartId}" class="card-metrics"></div>
        <div id="${chartId}" style="width:100%;height:220px;"></div>
      </div>
    ` : ''}
    ${(killSwitch || profitTarget || stopLoss || timeExit) ? `
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;">
        ${profitTarget ? `<div style="background:#e0f2ec;padding:4px 8px;border-radius:4px;color:#07473a;"><b>Target:</b> ${profitTarget}</div>` : ''}
        ${stopLoss ? `<div style="background:#fee2e2;padding:4px 8px;border-radius:4px;color:#991b1b;"><b>Stop:</b> ${stopLoss}</div>` : ''}
        ${killSwitch ? `<div style="background:#fef3c7;padding:4px 8px;border-radius:4px;color:#92400e;"><b>Kill:</b> ${killSwitch}</div>` : ''}
        ${timeExit ? `<div style="background:var(--cream-dark);padding:4px 8px;border-radius:4px;color:var(--ink-muted);"><b>Time:</b> ${timeExit}</div>` : ''}
      </div>
    ` : ''}
    <div class="card-meta">LLM cost: ${costUsd}</div>
  `;

  // Draw payoff chart if we have legs
  if (rawLegs.length && currentSpot > 0) {
    try {
      const nLegs = normalizeLegs(rawLegs, currentSpot);
      drawCardChart(chartId, nLegs, currentSpot);
    } catch (e) { console.warn('Chart draw failed for', modelId, e); }
  }
}

function setCardError(modelId, errMsg, elapsed) {
  const card = $(`card-${modelId}`);
  const status = $(`status-${modelId}`);
  const body = $(`body-${modelId}`);
  if (card) card.className = 'result-card error';
  if (status) { status.className = 'model-status error'; status.textContent = 'error'; }
  if (body) body.innerHTML = `<div class="reasoning-text" style="color:var(--red);">${errMsg}</div><div class="card-meta">${(elapsed / 1000).toFixed(1)}s</div>`;
}

async function runModelQuery(ticker, expiry, model) {
  const start = Date.now();
  try {
    const url = API_URL + '/api/recommend';
    const res = await fetch(url, {
      method: 'POST',
      headers: apiHeaders(),
      body: JSON.stringify({
        ticker,
        expiry: expiry || undefined,
        useLLMStrategy: true,
        strategyModel: model.id,
        noCache: true,
      }),
    });
    if (!res.ok) throw new Error(`API ${res.status}: ${res.statusText}`);
    const data = await res.json();
    const elapsed = Date.now() - start;
    const ep = data.enginePick || {};
    return {
      strategy: ep.strategy,
      direction: ep.direction,
      score: ep.score,
      reasoningOverride: ep.reasoningOverride || null,
      cost: data.cost || null,
      strategyPrompt: data.strategyPrompt || null,
      elapsed,
    };
  } catch (e) {
    return { error: e.message, elapsed: Date.now() - start };
  }
}

function buildSummaryRow(model, result) {
  const ro = result.reasoningOverride;
  const dec = ro?.decision || (ro?.noTrade ? 'NO_TRADE' : (ro?.confidence === 0 && (!ro?.suggestedLegs?.length) ? 'NO_TRADE' : 'APPROVED_TRADE'));
  const isNT = dec === 'NO_TRADE' || dec === 'DATA_ERROR';
  const isWL = dec === 'WATCHLIST_TRADE';
  const strategy = isNT ? 'NO_TRADE' : (ro?.strategy || result.strategy || '—');
  const direction = ro?.direction || result.direction || '—';
  const confidence = ro?.confidence ?? '—';
  const legs = formatLegs(ro?.suggestedLegs);
  const costUsd = result.cost?.totalCost != null ? `$${result.cost.totalCost.toFixed(4)}` : '—';
  const time = `${(result.elapsed / 1000).toFixed(1)}s`;
  const confClass = confidenceClass(confidence);
  const decLabel = isNT ? 'NO TRADE' : isWL ? 'WATCHLIST' : 'APPROVED';
  const decClass = isNT ? 'no-trade' : isWL ? 'watchlist' : 'approved';

  return `<tr>
    <td style="font-weight:600">${model.label}</td>
    <td><span class="decision-badge ${decClass}">${decLabel}</span></td>
    <td><span class="strategy-badge" style="font-size:11px;padding:2px 8px;">${strategy.replace(/_/g, ' ')}</span></td>
    <td>${direction}</td>
    <td class="${confClass}" style="font-weight:700;font-family:var(--mono)">${confidence}</td>
    <td style="font-family:var(--mono);font-size:11px">${legs}</td>
    <td style="font-family:var(--mono);font-size:11px">${costUsd}</td>
    <td style="font-family:var(--mono);font-size:11px">${time}</td>
  </tr>`;
}

// Find the expiry closest to the user's requested DTE
function findBestExpiry(expirations, targetDte) {
  if (!expirations || !expirations.length) return '';
  const now = Date.now();
  let best = expirations[0];
  let bestDiff = Infinity;
  for (const exp of expirations) {
    const expDte = Math.round((new Date(exp).getTime() - now) / 86400000);
    const diff = Math.abs(expDte - targetDte);
    if (diff < bestDiff) { bestDiff = diff; best = exp; }
  }
  return best;
}

// We need the best expiry + spot price from snapshot before running models
async function getSnapshot(ticker, targetDte) {
  const url = API_URL + `/api/snapshot/${ticker}`;
  const res = await fetch(url, { headers: apiHeaders() });
  if (!res.ok) throw new Error(`Snapshot failed: ${res.status}`);
  const data = await res.json();
  currentSpot = data.snapshot?.price || 0;
  const expiry = findBestExpiry(data.expirations || [], targetDte);
  const actualDte = Math.round((new Date(expiry).getTime() - Date.now()) / 86400000);
  return { expiry, spot: currentSpot, actualDte };
}

window.runComparison = async function() {
  const ticker = $('inp-ticker').value.trim().toUpperCase();
  const dte = parseInt($('inp-expiry').value) || 21;
  if (!ticker) { alert('Enter a ticker.'); return; }

  $('btn-run').disabled = true;
  $('inp-ticker').value = ticker;
  $('section-summary').classList.add('hidden');
  $('section-prompt').classList.add('hidden');

  // Setup progress
  const progress = $('progress');
  const progressFill = $('progress-fill');
  const progressText = $('progress-text');
  progress.classList.add('active');
  progressFill.style.width = '0%';
  progressText.textContent = `Fetching expiry for ${ticker}...`;

  // Setup cards
  const grid = $('results-grid');
  grid.innerHTML = '';
  MODELS.forEach(m => grid.appendChild(createCard(m)));

  // Get expiry + spot (match user's requested DTE)
  let expiry = '';
  try {
    const snap = await getSnapshot(ticker, dte);
    expiry = snap.expiry;
    progressText.textContent = `${ticker} @ $${snap.spot.toFixed(2)} · Expiry: ${expiry} (${snap.actualDte}d) — running ${MODELS.length} models...`;
  } catch (e) {
    progressText.textContent = `Warning: could not fetch snapshot — running with DTE ${dte}`;
  }

  // Run all models in parallel
  let completed = 0;
  let promptCaptured = false;
  const results = {};

  MODELS.forEach(m => setCardRunning(m.id));

  const promises = MODELS.map(async (model) => {
    const result = await runModelQuery(ticker, expiry, model);
    completed++;
    const pct = Math.round((completed / MODELS.length) * 100);
    progressFill.style.width = pct + '%';
    progressText.textContent = `${completed}/${MODELS.length} models complete (${pct}%)`;

    // Capture prompt from first successful response
    if (!promptCaptured && result.strategyPrompt) {
      promptCaptured = true;
      $('prompt-text').textContent = result.strategyPrompt;
      $('section-prompt').classList.remove('hidden');
    }

    results[model.id] = result;
    if (result.error) {
      setCardError(model.id, result.error, result.elapsed);
    } else {
      setCardResult(model.id, result);
    }
  });

  await Promise.all(promises);

  // Build summary table
  const tbody = $('summary-body');
  tbody.innerHTML = '';
  MODELS.forEach(m => {
    const r = results[m.id];
    if (r && !r.error) {
      tbody.innerHTML += buildSummaryRow(m, r);
    } else {
      tbody.innerHTML += `<tr><td style="font-weight:600">${m.label}</td><td colspan="6" style="color:var(--red)">${r?.error || 'Failed'}</td></tr>`;
    }
  });
  $('section-summary').classList.remove('hidden');

  progressText.textContent = `All ${MODELS.length} models complete.`;
  $('btn-run').disabled = false;
};
</script>
