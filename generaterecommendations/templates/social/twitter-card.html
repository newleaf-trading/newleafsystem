<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 675px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f172a;
  color: #f8fafc;
  overflow: hidden;
  position: relative;
}

.container {
  padding: 52px 60px;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.ticker {
  font-size: 20px;
  font-weight: 700;
  padding: 8px 16px;
  background: rgba(99, 102, 241, 0.15);
  border: 1px solid rgba(99, 102, 241, 0.3);
  border-radius: 8px;
  color: #a5b4fc;
}

.strategy-name {
  font-size: 18px;
  color: #64748b;
}

.pop-badge {
  font-size: 36px;
  font-weight: 800;
  color: #4ade80;
}

.pop-label {
  font-size: 14px;
  color: #64748b;
  margin-left: 8px;
}

/* Center */
.center {
  display: flex;
  align-items: center;
  gap: 48px;
}

.symbol-block {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.symbol-large {
  font-size: 80px;
  font-weight: 900;
  letter-spacing: -3px;
  line-height: 1;
}

.direction-tag {
  font-size: 16px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 2px;
}

.direction-tag.bullish { color: #4ade80; }
.direction-tag.bearish { color: #f87171; }
.direction-tag.neutral { color: #a5b4fc; }

.metrics-block {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px 48px;
}

.metric {
  display: flex;
  flex-direction: column;
}

.metric-val {
  font-size: 28px;
  font-weight: 700;
}

.metric-val.credit { color: #4ade80; }
.metric-val.loss { color: #f87171; }

.metric-lbl {
  font-size: 12px;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 2px;
}

/* Footer */
.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 16px;
  border-top: 1px solid #1e293b;
}

.legs-compact {
  font-family: 'SF Mono', monospace;
  font-size: 14px;
  color: #94a3b8;
}

.brand-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: #475569;
}

.leaf { color: #22c55e; font-size: 18px; }

/* Accent line */
.accent-line {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, #22c55e, #6366f1, #22c55e);
}
</style>
</head>
<body>
  <div class="accent-line"></div>

  <div class="container">
    <div class="header">
      <div class="left">
        <span class="ticker">${{SYMBOL}}</span>
        <span class="strategy-name">{{STRATEGY}}</span>
      </div>
      <div>
        <span class="pop-badge">{{POP}}%</span>
        <span class="pop-label">PoP</span>
      </div>
    </div>

    <div class="center">
      <div class="symbol-block">
        <span class="symbol-large">{{SYMBOL}}</span>
        <span class="direction-tag {{DIRECTION}}">{{DIRECTION_LABEL}}</span>
      </div>

      <div class="metrics-block">
        <div class="metric">
          <span class="metric-val credit">${{NET_CREDIT}}</span>
          <span class="metric-lbl">Credit</span>
        </div>
        <div class="metric">
          <span class="metric-val">${{MAX_PROFIT}}</span>
          <span class="metric-lbl">Max Profit</span>
        </div>
        <div class="metric">
          <span class="metric-val loss">${{MAX_LOSS}}</span>
          <span class="metric-lbl">Max Loss</span>
        </div>
        <div class="metric">
          <span class="metric-val">{{DTE}} days</span>
          <span class="metric-lbl">Expires</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="legs-compact">{{LEGS_TEXT}}</div>
      <div class="brand-foot">
        <span class="leaf">&#127811;</span>
        newleafsystem.com/picks
      </div>
    </div>
  </div>
</body>
</html>
